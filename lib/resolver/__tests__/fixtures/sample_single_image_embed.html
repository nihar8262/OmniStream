<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Instagram Embed</title>
</head>
<body>
  <div class="instagram-media">
    <div class="Header">
      <span class="UsernameText">photography_master</span>
    </div>
    <div class="EmbeddedMedia">
      <img class="EmbeddedMediaImage" src="https://scontent.cdninstagram.com/v/t51.2885-15/4321_single_image_highres.jpg?_nc_cat=101" alt="Beautiful landscape sunset in mountains" />
    </div>
    <div class="Caption">
      Golden hour in the Alps. Shot on 35mm. #nature #mountains
    </div>
  </div>
</body>
</html>
